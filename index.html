<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Houndler AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0e1621);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #708499);
      --button: var(--tg-theme-button-color, #2b5278);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --user-bubble: var(--tg-theme-button-color, #2b5278);
      --bot-bubble: var(--tg-theme-secondary-bg-color, #182533);
    }

    body {
      margin: 0;
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 130px;
      background: var(--secondary-bg);
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(128,128,128,0.15);
    }

    .sidebar button {
      width: 100%;
      background: var(--button);
      color: var(--button-text);
      border: none;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .chat-item {
      padding: 8px;
      margin-bottom: 4px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
      opacity: 0.8;
    }

    .chat-item.active {
      background: var(--button);
      color: var(--button-text);
      opacity: 1;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .msg {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user {
      background: var(--user-bubble);
      color: var(--button-text);
      margin-left: auto;
    }

    .bot {
      background: var(--bot-bubble);
      color: var(--text);
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: var(--secondary-bg);
      border-top: 1px solid rgba(128,128,128,0.15);
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .input-area input::placeholder {
      color: var(--hint);
    }

    .input-area button {
      margin-left: 8px;
      background: var(--button);
      color: var(--button-text);
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="newChat()">➕ Новый чат</button>
    <div id="chat-list"></div>
  </div>
  <div class="chat">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const WEBHOOK_URL = "https://api.telebotcreator.com/new-webhook?data=ТВОЙ_DATA";

    let currentChat = 1;
    let chats = [1];

    function addMessage(text, role) {
      const el = document.getElementById('messages');
      el.innerHTML += `<div class="msg ${role}">${text}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';
      addMessage('⏳ Думаю...', 'bot');

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            user_id: tg.initDataUnsafe.user.id,
            chat_id: currentChat
          })
        });
        const data = await response.json();

        const messages = document.getElementById('messages');
        messages.removeChild(messages.lastChild);

        if (data.result && data.result.answer) {
          addMessage(data.result.answer, 'bot');
        } else {
          addMessage("⚠️ Ошибка: " + JSON.stringify(data), 'bot');
        }
      } catch (err) {
        addMessage(`⚠️ Ошибка сети: ${err.message}`, 'bot');
      }
    }

    function newChat() {
      const id = chats.length + 1;
      chats.push(id);
      currentChat = id;
      document.getElementById('messages').innerHTML = '';
      addMessage('Новый чат создан', 'bot');
      renderChatList();
    }

    function renderChatList() {
      const list = document.getElementById('chat-list');
      list.innerHTML = '';
      chats.forEach((id) => {
        const active = id === currentChat ? 'active' : '';
        list.innerHTML += `<div class="chat-item ${active}" onclick="switchChat(${id})">💬 Чат ${id}</div>`;
      });
    }

    function switchChat(id) {
      currentChat = id;
      document.getElementById('messages').innerHTML = '';
      addMessage('Ты в чате ' + id, 'bot');
      renderChatList();
    }

    renderChatList();
  </script>
</body>
</html>
