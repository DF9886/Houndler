<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Houndler AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin: 0; font-family: -apple-system, sans-serif; background: #0e1621; color: #fff; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 130px; background: #17212b; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar button { width: 100%; background: #2b5278; color: #fff; border: none; padding: 10px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; font-size: 13px; }
    .chat { flex: 1; display: flex; flex-direction: column; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; }
    .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; max-width: 85%; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .user { background: #2b5278; margin-left: auto; }
    .bot { background: #182533; white-space: pre-wrap; }
    .input-area { display: flex; padding: 10px; background: #17212b; }
    .input-area input { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #0e1621; color: #fff; outline: none; font-size: 14px; }
    .input-area button { margin-left: 8px; background: #2b5278; color: #fff; border: none; padding: 0 16px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="newChat()">➕ Новый чат</button>
    <div id="chat-list"></div>
  </div>
  <div class="chat">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const WEBHOOK_URL = "https://api.telebotcreator.com/new-webhook?data=gAAAAABqulTuEfTdYqXeTzFLnfZT8tsiW-o644_nevoSVuiXGyx8deT8-hFvud1hhQn6y-RQF9d-UMgRxSOS2xYcDGZoflAvdoIGLvGbAfb7ZHR9EtOwmAsFze0BlirVWNe-H65NvtaI2GRoD2TAufWqOW5HHse13_S7lPz9XIa-AHElKYykl-2xh8J9VhA4tiAVTweSNHzL";

    let currentChat = 1;
    let chats = [1];

    function addMessage(text, role) {
      const el = document.getElementById('messages');
      el.innerHTML += `<div class="msg ${role}">${text}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';
      addMessage('⏳ Думаю...', 'bot');

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            user_id: tg.initDataUnsafe.user.id,
            chat_id: currentChat
          })
        });
        const data = await response.json();

        const messages = document.getElementById('messages');
        messages.removeChild(messages.lastChild);

        if (data.ok && data.result && data.result.answer) {
          addMessage(data.result.answer, 'bot');
        } else {
          addMessage("⚠️ Ошибка: " + JSON.stringify(data), 'bot');
        }
      } catch (err) {
        addMessage(`⚠️ Ошибка сети: ${err.message}`, 'bot');
      }
    }

    function newChat() {
      const id = chats.length + 1;
      chats.push(id);
      currentChat = id;
      document.getElementById('messages').innerHTML = '';
      addMessage('Новый чат создан', 'bot');
      renderChatList();
    }

    function renderChatList() {
      const list = document.getElementById('chat-list');
      list.innerHTML = '';
      chats.forEach((id) => {
        list.innerHTML += `<div class="chat-item" onclick="switchChat(${id})">💬 Чат ${id}</div>`;
      });
    }

    function switchChat(id) {
      currentChat = id;
      document.getElementById('messages').innerHTML = '';
      addMessage('Ты в чате ' + id, 'bot');
    }

    renderChatList();
  </script>
</body>
</html>
